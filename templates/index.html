<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Netflix Content Rating Prediction</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Netflix Content Rating Prediction</h1>

        <form method="POST" action="/predict">

            <label for="type">Content Type</label>
            <select id="type" name="type">
                <option value="Movie">Movie</option>
                <option value="TV Show">TV Show</option>
            </select>

            <label for="director">Director</label>
            <input
                type="text"
                id="director"
                name="director"
                placeholder="Enter director"
            >

            <label for="country">Country</label>
            <input
                type="text"
                id="country"
                name="country"
                placeholder="Enter country"
            >

            <label for="listed_in">Genres</label>
            <input
                type="text"
                id="listed_in"
                name="listed_in"
                placeholder="Example: Dramas, Comedies"
                required
            >

            <button type="submit">
                Predict Rating
            </button>

        </form>

    </div>

</body>
</html>
